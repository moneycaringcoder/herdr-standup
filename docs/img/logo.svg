<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="standup">
  <title>standup</title>
  <!--
    A window and what fell inside it. The upright bar on the left is the start
    of the window; three lanes run out of it, one per workspace. Filled dots are
    commits inside the window and are what the digest reports; the hollow ones
    behind the bar are older history, present and deliberately not counted. The
    third lane has nothing after the bar — that workspace was quiet, and a quiet
    lane is still drawn, because omitting it is the bug this plugin exists to
    avoid.

    Mid-tone colours on purpose: one file that reads on light and dark.
  -->
  <g stroke="#8b949e" stroke-width="3.5" stroke-linecap="round">
    <line x1="34" y1="14" x2="34" y2="114"/>
    <line x1="34" y1="38" x2="112" y2="38"/>
    <line x1="34" y1="64" x2="112" y2="64"/>
    <line x1="34" y1="90" x2="112" y2="90"/>
  </g>
  <g fill="none" stroke="#8b949e" stroke-width="3" stroke-opacity="0.55">
    <circle cx="16" cy="38" r="5"/>
    <circle cx="16" cy="90" r="5"/>
  </g>
  <g fill="#7ea6d8">
    <circle cx="52" cy="38" r="6.5"/>
    <circle cx="78" cy="38" r="6.5"/>
    <circle cx="100" cy="38" r="6.5"/>
    <circle cx="60" cy="64" r="6.5"/>
    <circle cx="92" cy="64" r="6.5"/>
  </g>
</svg>
