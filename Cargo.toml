[package]
name = "standup"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "A daily digest of what your agents actually did, across every herdr workspace."
license = "MIT"
repository = "https://github.com/moneycaringcoder/herdr-standup"

# The binary target inherits the package name => target/release/standup, which
# is what every command in herdr-plugin.toml points at.

[dependencies]
crook = { git = "https://github.com/moneycaringcoder/herdr-crook", rev = "ed0df17e2c515d94516f8ad088283896484fd71d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# Unix-only: localtime_r, so every timestamp we print carries a real local zone
# rather than a guess. No time crate, no network, no clock of our own.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
