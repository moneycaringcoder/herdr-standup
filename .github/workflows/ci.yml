name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # `matrix.name` rather than `matrix.os`, because two of these names are
    # load-bearing: `test (ubuntu-latest)` and `test (macos-latest)` are the
    # required status checks on `main`. A required check is matched by name, so
    # renaming one does not fail the gate — it removes it, and every pull
    # request then waits forever on a context that will never report. Adding
    # rows is free; renaming those two is not.
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every row runs. The point of a matrix this shape is seeing *which*
      # environment disagrees, and a cancelled row tells you nothing.
      fail-fast: false
      matrix:
        # Two OS families, two architectures, three runner images, plus one
        # pinned git build. The `*-latest` rows track whatever GitHub currently
        # ships, so the matrix keeps covering the newest image without being
        # edited; the pinned rows are the axes worth holding still. `macos-13` is
        # retired and `ubuntu-22.04` is deprecating, so neither is here: a row
        # that dies in a month is worse than no row.
        #
        # Measured on the first run of this matrix: **all five hosted rows were
        # git 2.55.0**, including the PPA one — the images have converged on the
        # newest stable release. So those rows buy OS and architecture coverage,
        # not git-version coverage, and the `newest git` row is here to diverge
        # the moment a newer git ships. git 2.55 redefined `--since today` from
        # the current instant to local midnight and no distro shipped a git new
        # enough to have caught it in advance; that row is what makes the next
        # one visible on the day it lands.
        #
        # An *older* git is the other half, and it needs a pinned build rather
        # than a runner label: no hosted image ships one any more, and
        # `ubuntu-22.04` — which would have been 2.34 — starts deprecating on
        # 2026-09-17. The last row below therefore builds git 2.36.6 from source
        # and caches it. 2.36 is the version worth holding: it is below **both**
        # lines the collector's behaviour turns on — 2.37, which brought
        # `--since-as-filter` and `GIT_NO_LAZY_FETCH`, and 2.55, which redefined
        # `--since today` — so one row exercises the `--max-age` fallback, the
        # problem it records, and the pre-2.55 reading of `today`.
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            git: distro
            # Format and clippy are platform-independent, so they run on exactly
            # one row rather than all of them. This row, because it is a
            # *required* check: a lint failure has to be able to block a merge,
            # and it can only do that from a context the ruleset names.
            lint: true
          - name: ubuntu-latest, newest git
            os: ubuntu-latest
            git: newest
          # arm64 and APFS, which enforces UTF-8 filenames where ext4 does not —
          # the reason `Fixture::awkward_paths_commit` has a fallback at all.
          - name: macos-latest
            os: macos-latest
            git: distro
          # x86_64 macOS, available until August 2027.
          - name: macos-15-intel
            os: macos-15-intel
            git: distro
          # The newest macOS image, and whatever Apple ships as git on it.
          - name: macos-26
            os: macos-26
            git: distro
          # The old end, built and cached because no image ships it. Ubuntu
          # rather than macOS: the build needs zlib headers and a compiler this
          # image already has.
          - name: ubuntu-latest, git 2.36.6
            os: ubuntu-latest
            git: build
            gitVersion: 2.36.6
    steps:
      - uses: actions/checkout@v7

      - name: Install the newest git
        if: matrix.git == 'newest'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y git

      # Restored by version, so the row costs one build and then nothing. A cold
      # build is about a minute; a miss is visible in the log rather than silent.
      - name: Cache the pinned git
        if: matrix.git == 'build'
        id: pinned-git
        uses: actions/cache@v6
        with:
          path: ~/.local/pinned-git
          key: pinned-git-${{ matrix.gitVersion }}-${{ matrix.os }}

      - name: Build the pinned git
        if: matrix.git == 'build' && steps.pinned-git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zlib1g-dev
          curl -fsSL -o git.tar.gz \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${{ matrix.gitVersion }}.tar.gz"
          tar xzf git.tar.gz
          cd "git-${{ matrix.gitVersion }}"
          # `-std=gnu11` is load-bearing: a C23 compiler defines `unreachable`
          # in <stddef.h>, and this git has a *function* by that name, so the
          # build dies in reflog.c without it. Everything optional is switched
          # off — the fixtures only ever talk to local repositories over
          # `file://`, so no curl, no gettext, no perl, no tcl.
          make -j"$(nproc)" prefix="$HOME/.local/pinned-git" \
            NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_CURL=1 NO_OPENSSL=1 \
            CFLAGS="-O2 -std=gnu11" install

      # After `actions/checkout`, which needs a git that can speak https, and
      # before anything that reads a git version — including the banner below,
      # so the log says which git the row actually ran.
      - name: Put the pinned git first on PATH
        if: matrix.git == 'build'
        run: echo "$HOME/.local/pinned-git/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # The git layer shells out to real git and the fixtures create real
      # commits, so git needs an identity on the runner. The fixtures also
      # depend on the default branch being `main`.
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "standup ci"
          git config --global init.defaultBranch main

      # Printed before anything can fail, so a red row carries its own evidence.
      # Every line here is something the plugin's behaviour depends on, and the
      # first cross-platform run cost real time precisely because this was not
      # in the log.
      - name: Environment
        run: |
          echo "runner:   ${{ matrix.os }} ($(uname -sm))"
          echo "git:      $(git --version) at $(command -v git)"
          echo "rustc:    $(rustc --version)"
          echo "now:      $(date +%s) ($(date))"
          echo "--since today    -> $(git rev-parse --since=today)"
          echo "--since midnight -> $(git rev-parse --since=midnight)"
          # Captured rather than interpolated, because `$?` inside an `echo`
          # reports the echo. The exit status is the interesting half: git
          # answers *now* with status 0 for input it cannot parse, and
          # `resolve_date` exists because of that.
          garbage=$(git rev-parse --since=bogusgarbage) && status=0 || status=$?
          echo "--since garbage  -> $garbage (exit $status)"
          printf -- '--since-as-filter: '
          if git log --since-as-filter=@0 --format= --max-count=0 >/dev/null 2>&1; then
            echo "supported"
          else
            echo "NOT supported (git is older than 2.37; the collector falls back to --max-age)"
          fi

      - name: Format
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # First, and on its own, because the answer to "is the plugin wrong or did
      # the environment change under it" is the expensive thing to work out from
      # a red build. Everything in this target asserts what *git* does, with no
      # standup code in the way: if it fails, start with docs/git-plumbing.md.
      - name: Environment contract
        run: cargo test --locked --test git_contract

      # And if the contract passed but this fails, the plugin is wrong.
      - name: Test
        run: cargo test --locked --all

      - name: Release build
        run: cargo build --release --locked
