name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # `matrix.name` rather than `matrix.os`, because two of these names are
    # load-bearing: `test (ubuntu-latest)` and `test (macos-latest)` are the
    # required status checks on `main`. A required check is matched by name, so
    # renaming one does not fail the gate — it removes it, and every pull
    # request then waits forever on a context that will never report. Adding
    # rows is free; renaming those two is not.
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every row runs. The point of a matrix this shape is seeing *which*
      # environment disagrees, and a cancelled row tells you nothing.
      fail-fast: false
      matrix:
        # Two OS families, two architectures, three runner images. The
        # `*-latest` rows track whatever GitHub currently ships, so the matrix
        # keeps covering the newest image without being edited; the pinned rows
        # are the axes worth holding still. `macos-13` is retired and
        # `ubuntu-22.04` is deprecating, so neither is here: a row that dies in
        # a month is worse than no row.
        #
        # Measured on the first run of this matrix: **all five rows are git
        # 2.55.0**, including the PPA one — the images have converged on the
        # newest stable release. So this buys OS and architecture coverage
        # today, not git-version coverage, and the `newest git` row is here to
        # diverge the moment a newer git ships. git 2.55 redefined
        # `--since today` from the current instant to local midnight and no
        # distro shipped a git new enough to have caught it in advance; this row
        # is what makes the next one visible on the day it lands.
        #
        # An *older* git is the other half, and needs a pinned build rather than
        # a runner image: the `--since-as-filter` fallback and the pre-2.55
        # reading of `today` are unexercised anywhere right now. Filed
        # separately.
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            git: distro
            # Format and clippy are platform-independent, so they run on exactly
            # one row rather than five. This row, because it is a *required*
            # check: a lint failure has to be able to block a merge, and it can
            # only do that from a context the ruleset names.
            lint: true
          - name: ubuntu-latest, newest git
            os: ubuntu-latest
            git: newest
          # arm64 and APFS, which enforces UTF-8 filenames where ext4 does not —
          # the reason `Fixture::awkward_paths_commit` has a fallback at all.
          - name: macos-latest
            os: macos-latest
            git: distro
          # x86_64 macOS, available until August 2027.
          - name: macos-15-intel
            os: macos-15-intel
            git: distro
          # The newest macOS image, and whatever Apple ships as git on it.
          - name: macos-26
            os: macos-26
            git: distro
    steps:
      - uses: actions/checkout@v7

      - name: Install the newest git
        if: matrix.git == 'newest'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y git

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # The git layer shells out to real git and the fixtures create real
      # commits, so git needs an identity on the runner. The fixtures also
      # depend on the default branch being `main`.
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "standup ci"
          git config --global init.defaultBranch main

      # Printed before anything can fail, so a red row carries its own evidence.
      # Every line here is something the plugin's behaviour depends on, and the
      # first cross-platform run cost real time precisely because this was not
      # in the log.
      - name: Environment
        run: |
          echo "runner:   ${{ matrix.os }} ($(uname -sm))"
          echo "git:      $(git --version)"
          echo "rustc:    $(rustc --version)"
          echo "now:      $(date +%s) ($(date))"
          echo "--since today    -> $(git rev-parse --since=today)"
          echo "--since midnight -> $(git rev-parse --since=midnight)"
          # Captured rather than interpolated, because `$?` inside an `echo`
          # reports the echo. The exit status is the interesting half: git
          # answers *now* with status 0 for input it cannot parse, and
          # `resolve_date` exists because of that.
          garbage=$(git rev-parse --since=bogusgarbage) && status=0 || status=$?
          echo "--since garbage  -> $garbage (exit $status)"
          printf -- '--since-as-filter: '
          if git log --since-as-filter=@0 --format= --max-count=0 >/dev/null 2>&1; then
            echo "supported"
          else
            echo "NOT supported (git is older than 2.37; the collector falls back to --max-age)"
          fi

      - name: Format
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # First, and on its own, because the answer to "is the plugin wrong or did
      # the environment change under it" is the expensive thing to work out from
      # a red build. Everything in this target asserts what *git* does, with no
      # standup code in the way: if it fails, start with docs/git-plumbing.md.
      - name: Environment contract
        run: cargo test --locked --test git_contract

      # And if the contract passed but this fails, the plugin is wrong.
      - name: Test
        run: cargo test --locked --all

      - name: Release build
        run: cargo build --release --locked
