# herdr plugin: standup
#
# A digest of what your agents actually did. One command, one readable summary
# of every workspace over a time window: commits, change volume, branch, and
# whether the work landed anywhere.
#
# Install:   herdr plugin install moneycaringcoder/herdr-standup
# Local dev: herdr plugin link /path/to/herdr-standup   (does NOT run [[build]])
# Remove:    herdr plugin unlink moneycaringcoder.standup
# Logs:      herdr plugin log list --plugin moneycaringcoder.standup

id = "moneycaringcoder.standup"
name = "Standup"
version = "0.1.1"
# The supported floor stays at 0.8.0, whose protocol-19 snapshot is captured in
# the compatibility fixture. The consumed `session_snapshot` shape was last
# revalidated live on stable 0.8.2, whose snapshot JSON reports protocol 20.
# Herdr's separate client/server wire protocol is 21 and does not change that
# JSON metadata or shape. Earlier servers may carry the fields used here, but
# lowering the measured compatibility floor would be an inferred claim.
min_herdr_version = "0.8.0"
description = "A daily digest of what your agents actually did, across every workspace."
platforms = ["linux", "macos"]

# Commands are argv arrays run with no shell and a minimal PATH, with the plugin
# root as cwd. Compiled once at install time; the resulting binary is what every
# command below invokes.
[[build]]
command = ["cargo", "build", "--release", "--locked"]

# Pane entrypoints are the visible surfaces. `digest` is interactive; the
# existing format panes remain scrollable one-shot reports for the demo.
[[panes]]
id = "digest"
title = "Standup: interactive digest"
placement = "overlay"
command = ["./target/release/standup", "--tui"]

[[panes]]
id = "today"
title = "Standup: today"
placement = "overlay"
command = ["./target/release/standup", "--report"]

[[panes]]
id = "since-last"
title = "Standup: since the last one"
placement = "overlay"
command = ["./target/release/standup", "--report", "--since-last"]

[[panes]]
id = "yesterday"
title = "Standup: yesterday and today"
placement = "overlay"
command = ["./target/release/standup", "--report", "--since", "yesterday"]

[[panes]]
id = "markdown"
title = "Standup: Markdown to paste"
placement = "overlay"
command = ["./target/release/standup", "--markdown"]

[[panes]]
id = "slack"
title = "Standup: Slack message to paste"
placement = "overlay"
command = ["./target/release/standup", "--slack"]

[[panes]]
id = "html"
title = "Standup: HTML to email"
placement = "overlay"
command = ["./target/release/standup", "--html"]

[[panes]]
id = "json"
title = "Standup: JSON snapshot"
placement = "overlay"
command = ["./target/release/standup", "--json"]

# The interactive front door calls back into Herdr to open `digest`. Existing
# actions keep routing through the binary's same-id one-shot pane helper.
[[actions]]
id = "open-digest"
title = "Standup: open digest"
description = "Open the interactive digest pane."
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin moneycaringcoder.standup --entrypoint digest"]

[[actions]]
id = "today"
title = "Standup: today"
description = "What every workspace produced since local midnight."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--report"]

[[actions]]
id = "since-last"
title = "Standup: since the last one"
description = "Everything since the last digest you read."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--report", "--since-last"]

[[actions]]
id = "yesterday"
title = "Standup: yesterday and today"
description = "A two-day window, for the morning after."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--report", "--since", "yesterday"]

[[actions]]
id = "markdown"
title = "Standup: Markdown to paste"
description = "The same digest as Markdown, ready for a standup channel."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--markdown"]

[[actions]]
id = "slack"
title = "Standup: Slack message to paste"
description = "The same digest as Slack mrkdwn, which is not Markdown: single-asterisk bold, literal bullets, escaped entities."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--slack"]

[[actions]]
id = "html"
title = "Standup: HTML to email"
description = "The same digest as a self-contained HTML document, styles inline, nothing to fetch."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--html"]

[[actions]]
id = "json"
title = "Standup: JSON snapshot"
description = "Machine-readable digest for scripting. Does not move the --since-last marker."
contexts = ["global", "workspace"]
command = ["./target/release/standup", "--json"]
